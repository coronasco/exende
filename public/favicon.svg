<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Exende</title>
  <desc id="desc">Geometric EXE monogram on a dark neon interface tile</desc>
  <defs>
    <linearGradient id="frame" x1="18" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59E7FF"/>
      <stop offset="0.52" stop-color="#4D67FF"/>
      <stop offset="1" stop-color="#A06DFF"/>
    </linearGradient>
    <linearGradient id="mark" x1="49" y1="40" x2="82" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62ECFF"/>
      <stop offset="0.54" stop-color="#4D8DFF"/>
      <stop offset="1" stop-color="#A775FF"/>
    </linearGradient>
    <radialGradient id="surface" cx="0" cy="0" r="1" gradientTransform="translate(63 51) rotate(90) scale(76)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2445"/>
      <stop offset="0.58" stop-color="#050E20"/>
      <stop offset="1" stop-color="#020817"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="tile">
      <rect x="4" y="4" width="120" height="120" rx="25"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="4" y="4" width="120" height="120" rx="25" fill="url(#surface)"/>
    <path d="M12 42H116M12 64H116M12 86H116M42 12V116M64 12V116M86 12V116" stroke="#6ABBEA" stroke-opacity="0.055"/>
    <ellipse cx="64" cy="64" rx="47" ry="35" fill="none" stroke="#50DFFF" stroke-opacity="0.12"/>
    <ellipse cx="64" cy="64" rx="36" ry="47" fill="none" stroke="#8B72FF" stroke-opacity="0.1"/>
    <circle cx="64" cy="64" r="24" fill="#3A7CFF" fill-opacity="0.2" filter="url(#glow)"/>
    <path d="M12 100C36 89 42 111 69 99C88 91 98 98 116 88" fill="none" stroke="url(#frame)" stroke-opacity="0.18"/>
  </g>

  <rect x="4" y="4" width="120" height="120" rx="25" fill="none" stroke="#A6DFF5" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="7" y="7" width="114" height="114" rx="22" fill="none" stroke="url(#frame)" stroke-width="2"/>

  <g fill="#F6FAFF">
    <path d="M18 40H44V47H26V54H41V61H26V69H44V76H18Z"/>
    <path d="M86 40H112V47H94V54H109V61H94V69H112V76H86Z"/>
  </g>
  <path d="M49 40H58L65 51.5L72 40H81L70 58L81 76H72L65 64.5L58 76H49L60 58Z" fill="url(#mark)"/>

  <circle cx="64" cy="19" r="2" fill="#61E7FF"/>
  <circle cx="109" cy="64" r="1.8" fill="#9C74FF"/>
  <circle cx="64" cy="109" r="1.5" fill="#4D8DFF"/>
  <circle cx="19" cy="64" r="1.8" fill="#61E7FF"/>
</svg>
